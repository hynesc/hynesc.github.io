<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Signal Assistant</title>
  <desc id="desc">An illustrative conversation connected to a locally hosted language model.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102c43"/><stop offset="1" stop-color="#173f55"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="1110" cy="40" r="280" fill="#59d6ba" opacity=".055"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="68" y="83" fill="#8de4d0" font-size="21" letter-spacing="4">SELF-HOSTED CONVERSATIONAL AI</text>
    <text x="65" y="169" fill="#fff" font-size="67" font-weight="700">Signal Assistant</text>
    <text x="69" y="219" fill="#b9cdd9" font-size="27">Local inference. Configurable conversations.</text>
    <rect x="70" y="277" width="660" height="305" rx="22" fill="#fff" fill-opacity=".06" stroke="#5e899f" stroke-opacity=".5"/>
    <circle cx="112" cy="318" r="9" fill="#83dec7"/>
    <text x="137" y="327" fill="#dceaf0" font-size="24">Conversation</text>
    <path d="M70 351H730" stroke="#5e899f" stroke-opacity=".4"/>
    <rect x="266" y="379" width="427" height="61" rx="17" fill="#d6ebf4"/>
    <text x="291" y="418" fill="#173f55" font-size="24">Help me think through an idea.</text>
    <rect x="105" y="465" width="493" height="78" rx="17" fill="#278475"/>
    <text x="130" y="498" fill="#fff" font-size="24">Let's start with what you want</text>
    <text x="130" y="528" fill="#fff" font-size="24">to accomplish.</text>
    <path d="M758 429H823" stroke="#8de4d0" stroke-width="3" stroke-dasharray="7 8"/>
    <rect x="844" y="342" width="278" height="176" rx="23" fill="#102c43" stroke="#75d5be" stroke-width="2"/>
    <g stroke="#8de4d0" stroke-width="2" fill="none">
      <rect x="954" y="368" width="57" height="48" rx="8"/>
      <path d="M968 368v-10m14 10v-10m14 10v-10m-28 58v10m14-10v10m14-10v10m-42-44h-10m10 14h-10m67-14h10m-10 14h10"/>
    </g>
    <text x="983" y="461" fill="#fff" text-anchor="middle" font-size="29" font-weight="700">Local LLM</text>
    <text x="983" y="495" fill="#b9cdd9" text-anchor="middle" font-size="20">Ollama inference</text>
    <text x="70" y="635" fill="#90afc0" font-size="20" letter-spacing="2">PYTHON / SIGNAL CLI / OLLAMA / DOCKER</text>
  </g>
</svg>
