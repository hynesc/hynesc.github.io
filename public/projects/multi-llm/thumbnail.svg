<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Multi-LLM: Best-of-N Response Selection</title>
  <desc id="desc">Three parallel candidate responses connect to a judge that selects one answer.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#192b4d"/><stop offset="1" stop-color="#303959"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="1110" cy="30" r="280" fill="#bba6ff" opacity=".055"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="68" y="83" fill="#c6b9ff" font-size="21" letter-spacing="4">MULTI-MODEL INFERENCE</text>
    <text x="65" y="169" fill="#fff" font-size="67" font-weight="700">Multi-LLM</text>
    <text x="69" y="219" fill="#c0c9df" font-size="27">Generate candidates. Select one answer.</text>
    <g fill="none" stroke="#9d99d1" stroke-width="3">
      <path d="M275 416H323V325H369M323 416H369M323 416V507H369"/>
      <path d="M616 325H664V416H709M616 416H709M616 507H664V416"/>
      <path d="M899 416H960" stroke="#8de4d0"/>
    </g>
    <rect x="70" y="376" width="205" height="81" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#65779e"/>
    <text x="172" y="427" text-anchor="middle" fill="#fff" font-size="28">Prompt</text>
    <g fill="#343d64" stroke="#8b86bd">
      <rect x="369" y="289" width="247" height="72" rx="15"/>
      <rect x="369" y="380" width="247" height="72" rx="15"/>
      <rect x="369" y="471" width="247" height="72" rx="15"/>
    </g>
    <g fill="#e7e5f8" font-size="25" text-anchor="middle">
      <text x="492" y="334">Candidate A</text>
      <text x="492" y="425">Candidate B</text>
      <text x="492" y="516">Candidate C</text>
    </g>
    <rect x="709" y="360" width="190" height="113" rx="19" fill="#52477e" stroke="#c6b9ff" stroke-width="2"/>
    <text x="804" y="410" fill="#fff" text-anchor="middle" font-size="28" font-weight="700">Judge</text>
    <text x="804" y="444" fill="#d1c8ef" text-anchor="middle" font-size="20">LLM selection</text>
    <rect x="960" y="360" width="173" height="113" rx="19" fill="#245b60" stroke="#8de4d0" stroke-width="2"/>
    <path d="m1028 388 12 12 22-24" fill="none" stroke="#8de4d0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1046" y="442" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">Winner</text>
    <text x="70" y="635" fill="#a1aec8" font-size="20" letter-spacing="2">FASTAPI / ASYNCIO / OLLAMA / DOCKER</text>
  </g>
</svg>
